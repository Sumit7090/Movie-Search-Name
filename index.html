<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 Movie Explorer</h1>
        <p>Search your favourite movies</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter movie name...">
        <button onclick="searchMovies()">Search</button>
    </div>

    <h2 id="heading">Popular Movies</h2>

    <div id="movieContainer" class="movie-container"></div>

    <div id="movieDetails" class="movie-details"></div>

    <script src="script.js"></script>
</body>
</html>
